# Buduje niepodpisany plik .ipa aplikacji Szlakowy na Macu w chmurze GitHuba.
# Gotowy plik pobierzesz z zakładki Actions → wybrany przebieg → Artifacts.
# KSign (lub inny sideloader) podpisze go Twoim certyfikatem przy instalacji.

name: Zbuduj IPA (iOS, niepodpisane)

on:
  workflow_dispatch: # przycisk „Run workflow” w zakładce Actions
    inputs:
      runner:
        description: 'Maszyna (gdy jedna długo czeka w kolejce, wybierz inną)'
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-latest
          - macos-15
          - macos-15-intel

jobs:
  build-ipa:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 90

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Wybierz najnowszy Xcode
        run: |
          echo "Dostępne wersje Xcode:"; ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Używam: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          # Expo SDK 58 wymaga Xcode 26.4 lub nowszego
          VER=$(xcodebuild -version | head -1 | awk '{print $2}')
          if [ "$(printf '%s\n' 26.4 "$VER" | sort -V | head -1)" != "26.4" ]; then
            echo "::error::Na tej maszynie najnowszy Xcode to $VER, a Expo SDK 58 potrzebuje 26.4+. Uruchom ponownie z maszyną macos-26."
            exit 1
          fi

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Zainstaluj paczki
        run: npm ci

      - name: Wygeneruj projekt iOS (Expo prebuild)
        run: npx expo prebuild --platform ios --clean --no-install
        env:
          CI: 1

      - name: CocoaPods
        run: cd ios && pod install

      - name: Zbuduj aplikację (bez podpisu)
        shell: bash
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "Workspace: $WS, scheme: $SCHEME"
          mkdir -p build
          set +e
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > build/xcodebuild.log 2>&1
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            echo "::group::Linie z błędami"
            grep -nE "error:|fatal error|Error:|FAILED|failed with exit" build/xcodebuild.log | head -150
            echo "::endgroup::"
            echo "::group::Wyjście skryptu ExpoModulesJSI"
            grep -n "Build ExpoModulesJSI xcframework" build/xcodebuild.log | head -3
            LINE=$(grep -n "PhaseScriptExecution \[CP-User\]\\ Build\\ ExpoModulesJSI" build/xcodebuild.log | head -1 | cut -d: -f1)
            if [ -n "$LINE" ]; then sed -n "${LINE},$((LINE+250))p" build/xcodebuild.log | cut -c1-500; fi
            echo "::endgroup::"
            tail -n 80 build/xcodebuild.log
            exit $STATUS
          fi
          tail -n 20 build/xcodebuild.log

      - name: Zapisz log budowania (przy błędzie)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 7

      - name: Spakuj do .ipa
        run: |
          APP=$(ls -d build/App.xcarchive/Products/Applications/*.app | head -1)
          test -n "$APP" || (echo "Nie znaleziono .app w archiwum" && exit 1)
          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -qry Szlakowy.ipa Payload
          ls -lh Szlakowy.ipa

      - name: Udostępnij plik do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: Szlakowy-ipa
          path: build/Szlakowy.ipa
          retention-days: 14
